<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lipa: Learn Slovenian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F7F6;--surface:#FFFFFF;--ink:#15262A;--muted:#587075;--line:#D6E2DF;
  --lake:#1D7C74;--lake-deep:#125A54;--lake-soft:#DDEFEC;--on-lake:#FFFFFF;
  --linden:#E3B22B;--linden-soft:#FBF1D2;--on-linden:#2A2106;
  --good:#2B9A57;--good-soft:#E1F4E8;--bad:#CF4242;--bad-soft:#FBE4E4;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E191B;--surface:#152427;--ink:#E4EEEC;--muted:#8FA5A8;--line:#253A3D;
    --lake:#3AA99D;--lake-deep:#7FD3C9;--lake-soft:#173A37;--on-lake:#06201D;
    --linden:#E8BD45;--linden-soft:#3A3218;--on-linden:#241C04;
    --good:#45C07A;--good-soft:#143524;--bad:#F06A6A;--bad-soft:#3D1C1C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E191B;--surface:#152427;--ink:#E4EEEC;--muted:#8FA5A8;--line:#253A3D;
  --lake:#3AA99D;--lake-deep:#7FD3C9;--lake-soft:#173A37;--on-lake:#06201D;
  --linden:#E8BD45;--linden-soft:#3A3218;--on-linden:#241C04;
  --good:#45C07A;--good-soft:#143524;--bad:#F06A6A;--bad-soft:#3D1C1C;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
img,svg{max-width:100%}
:focus-visible{outline:3px solid var(--linden);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* layout */
.app{display:grid;grid-template-columns:210px minmax(0,1fr) 290px;gap:40px;max-width:1240px;margin:0 auto;padding:0 24px}
.nav{position:sticky;top:0;align-self:start;padding:28px 0;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.6rem;margin:0 0 24px 6px;color:var(--lake-deep)}
.brand svg{color:var(--lake)}
.nl{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;background:none;border:0;color:var(--muted);font-weight:600;text-align:left}
.nl:hover{color:var(--ink);background:var(--surface)}
.nl[aria-current="page"]{background:var(--lake-soft);color:var(--lake-deep)}
.nav .small{margin-top:24px;display:flex;flex-direction:column;gap:2px}
.nav .small button{background:none;border:0;color:var(--muted);text-align:left;padding:6px 14px;font-size:.88rem;border-radius:8px}
.nav .small button:hover{color:var(--ink)}
main{padding:32px 0 80px;min-width:0}
.rail{position:sticky;top:0;align-self:start;padding:32px 0;display:grid;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
.panel h3{margin:0 0 4px;font-size:1.05rem}
.panel p{margin:0;color:var(--muted);font-size:.92rem}
.streak{display:flex;align-items:center;gap:14px}
.streak .num{width:52px;height:52px;border-radius:50%;background:var(--linden-soft);color:var(--on-linden);display:grid;place-items:center;font:800 1.35rem "Bricolage Grotesque",sans-serif}
:root[data-theme="dark"] .streak .num{color:var(--linden)}
.goal{display:flex;align-items:center;gap:14px}
.ring{--p:0;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--lake) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring span{width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:.78rem;font-weight:700}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.meter i{display:block;height:100%;background:var(--lake);border-radius:99px}
.mstats{display:none;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.88rem;font-weight:600}
.chip b{font-family:"Bricolage Grotesque",sans-serif}

/* level header */
.lvl{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.lvl h1{margin:0;font-size:2rem;line-height:1.1}
.lvl p{margin:4px 0 0;color:var(--muted)}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:700;font-size:.9rem}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab:disabled{opacity:.45;cursor:not-allowed}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--lake);color:var(--on-lake);border-radius:24px;padding:26px 28px 26px}
.hero .leaf{position:absolute;right:-40px;top:-30px;width:230px;height:230px;opacity:.14;color:var(--on-lake);pointer-events:none}
.hero .meta{margin:0;font-size:.95rem;opacity:.85}
.hero .sl{font:800 clamp(2.5rem,7vw,4rem)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.03em;margin:10px 0 6px}
.hero .en{margin:0 0 20px;font-size:1.05rem;opacity:.9}
.btn{background:var(--linden);color:var(--on-linden);border:0;border-radius:99px;padding:13px 24px;font-weight:700;font-size:1rem}
.btn:hover{filter:brightness(1.05)}
.ghost{display:inline-flex;align-items:center;gap:8px;background:var(--lake-soft);color:var(--lake-deep);border:0;border-radius:99px;padding:10px 16px;font-weight:700}

/* trail timeline */
.trail{list-style:none;margin:36px 0 0;padding:0;position:relative}
.trail::before{content:"";position:absolute;left:23px;top:30px;bottom:40px;width:3px;background:repeating-linear-gradient(var(--line) 0 8px,transparent 8px 15px)}
.ch{position:relative;padding-left:68px;margin-bottom:12px}
.node{--p:0;position:absolute;left:0;top:8px;width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--lake) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.node span{width:38px;height:38px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font:700 1rem "Bricolage Grotesque",sans-serif;color:var(--muted)}
.node.full span{background:var(--lake);color:var(--on-lake)}
.node.part span{color:var(--lake-deep)}
.chhead{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.chhead:hover{border-color:var(--lake)}
.chhead h3{margin:0;font-size:1.3rem;line-height:1.2}
.chhead .en{color:var(--muted);font-size:.92rem}
.chhead .cnt{margin-left:auto;font-size:.85rem;color:var(--muted);white-space:nowrap}
.chhead .chev{transition:transform .2s;color:var(--muted)}
.ch.open .chev{transform:rotate(180deg)}
.lessons{list-style:none;margin:6px 0 4px;padding:0;display:none;gap:4px}
.ch.open .lessons{display:grid}
.lrow{display:flex;align-items:center;gap:14px;width:100%;padding:10px 14px;border-radius:14px;background:none;border:1px solid transparent;text-align:left}
.lrow:hover{background:var(--surface);border-color:var(--line)}
.lic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--lake-soft);color:var(--lake-deep);flex:none}
.lrow.done .lic{background:var(--good-soft);color:var(--good)}
.lrow .nm{font-weight:600}
.lrow .st{margin-left:auto;font-size:.85rem;color:var(--muted);font-weight:600}
.lrow.done .st{color:var(--good)}
.summit{position:relative;padding-left:68px;margin-top:22px}
.summit .node{background:var(--linden-soft)}
.summit .node span{background:transparent;color:var(--linden)}
.summit h3{margin:10px 0 0;font-size:1.3rem}
.summit p{margin:2px 0 0;color:var(--muted)}

/* pages */
.ph h1{margin:0;font-size:2rem}
.ph p{color:var(--muted);margin:4px 0 16px;max-width:60ch}
.search{width:100%;max-width:420px;font:inherit;padding:12px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.wsec{margin-top:28px}
.wsec h2{font-size:1.2rem;margin:0 0 8px}
.wsec h2 small{font-family:Figtree,sans-serif;color:var(--muted);font-weight:500;font-size:.9rem;margin-left:6px}
.wlist{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .s{font-weight:700;min-width:0;flex:1}
.wrow .e{color:var(--muted);flex:1;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.dot.on{background:var(--good)}
.say{width:40px;height:40px;border-radius:50%;border:0;background:var(--lake-soft);color:var(--lake-deep);display:inline-grid;place-items:center;flex:none;vertical-align:middle}
.say:hover{filter:brightness(.97)}
.note{background:var(--linden-soft);border-radius:14px;padding:12px 16px;margin:14px 0 0;font-size:.92rem;max-width:62ch}
.revcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:26px;margin-top:10px}
.revcard h2{margin:0 0 6px;font-size:1.5rem}
.revcard p{color:var(--muted);margin:0 0 18px}

/* lesson overlay */
.lesson{position:fixed;inset:0;z-index:60;background:var(--paper);display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lesson.on{display:flex}
.ltop{display:flex;align-items:center;gap:16px;padding:14px 20px;max-width:760px;width:100%;margin:0 auto}
.x{background:none;border:0;color:var(--muted);width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.x:hover{background:var(--surface);color:var(--ink)}
.bar{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--lake);border-radius:99px;transition:width .35s ease}
.lbody{flex:1;overflow-y:auto;padding:20px 20px 32px}
.stage{max-width:640px;margin:0 auto}
.lfoot{border-top:1px solid var(--line);background:var(--surface);padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));transition:background .2s}
.lfoot.good{background:var(--good-soft);border-color:transparent}
.lfoot.bad{background:var(--bad-soft);border-color:transparent}
.fin{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:52px}
.fb{font-size:.98rem}
.fb strong{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.2rem}
.lfoot.good .fb strong{color:var(--good)}
.lfoot.bad .fb strong{color:var(--bad)}
.go{background:var(--lake);color:var(--on-lake);border:0;border-radius:14px;padding:14px 26px;font-weight:700;min-width:150px;margin-left:auto}
.go:disabled{opacity:.35;cursor:not-allowed}
.lfoot.good .go{background:var(--good);color:#fff}
.lfoot.bad .go{background:var(--bad);color:#fff}

/* exercises */
.q{color:var(--muted);margin:0 0 10px;font-weight:600}
.big{font:700 clamp(2rem,6vw,2.9rem)/1.12 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin:0 0 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.big.long{font-size:clamp(1.4rem,4.4vw,1.9rem)}
.trans{font-size:1.25rem;color:var(--muted);margin:-8px 0 0}
.opts{display:grid;gap:10px}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.opt{text-align:left;padding:15px 18px;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-size:1.05rem}
.opt:hover{border-color:var(--lake)}
.opt.sel{border-color:var(--lake);background:var(--lake-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.locked .opt,.locked .tile,.locked input{pointer-events:none}
.sent{font:600 1.55rem/1.45 "Bricolage Grotesque",sans-serif;margin:0 0 4px}
.blank{display:inline-block;min-width:96px;border-bottom:3px solid var(--lake);text-align:center;color:var(--lake-deep);padding:0 6px}
.hint{color:var(--muted);margin:0 0 22px}
.ans{width:100%;font:inherit;font-size:1.3rem;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink)}
.ans:focus{border-color:var(--lake);outline:none}
.keys{display:flex;gap:8px;margin-top:10px}
.keys button{width:46px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1.05rem}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:grid;gap:10px;align-content:start}
.mt{padding:14px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-size:1rem;text-align:center}
.mt.sel{border-color:var(--lake);background:var(--lake-soft)}
.mt.ok{opacity:.35;border-color:var(--good);pointer-events:none}
.mt.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ansline{min-height:62px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:22px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:10px 14px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--surface);font-size:1.1rem}
.tile.used{visibility:hidden}
.dl{display:grid;gap:14px;margin-top:18px}
.line{display:flex;gap:10px;align-items:flex-end}
.line.r{flex-direction:row-reverse}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:11px 15px;max-width:80%;text-align:left;cursor:pointer}
.line.r .bub{background:var(--lake-soft);border-color:transparent}
.who{font-size:.8rem;color:var(--muted);font-weight:600}
.bub .s{font-size:1.15rem;font-weight:600}
.bub .e{display:none;color:var(--muted);font-size:.93rem;margin-top:2px}
.bub.show .e{display:block}
.gh{font-size:1.8rem;margin:0 0 12px}
.gbody{font-size:1.05rem;max-width:62ch}
.gbody p{margin:0 0 12px}
.gt{border-collapse:collapse;margin:6px 0 16px}
.gt td{padding:7px 22px 7px 0;border-bottom:1px solid var(--line)}
.gt td:first-child{color:var(--muted)}
.gt td b{font-weight:700}
.tip{background:var(--linden-soft);border-radius:14px;padding:12px 16px}
.done{text-align:center;padding-top:24px}
.done svg{color:var(--lake);width:96px;height:96px}
.done h2{font-size:2.4rem;margin:10px 0 4px}
.done p{color:var(--muted);margin:0}
.stats{display:flex;justify-content:center;gap:14px;margin-top:26px;flex-wrap:wrap}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 22px;min-width:110px}
.stats b{display:block;font:800 1.8rem "Bricolage Grotesque",sans-serif}
.stats span{color:var(--muted);font-size:.88rem}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:80;max-width:90vw;display:none}
.toast.on{display:block}

@media (max-width:1100px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .rail{display:none}
  .mstats{display:flex}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr;padding:0 16px;gap:0}
  .nav{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;flex-direction:row;justify-content:space-around;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .brand,.nav .small{display:none}
  .nl{flex-direction:column;gap:2px;font-size:.78rem;padding:6px 14px}
  main{padding:20px 0 110px}
  .hero{padding:22px}
  .chhead .cnt{display:none}
  .lvl h1{font-size:1.7rem}
}
</style>
</head>
<body>
<div class="app">
  <nav class="nav" aria-label="Main">
    <div class="brand"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21C6.5 17.6 3.5 13.8 3.5 9.9A4.4 4.4 0 0 1 12 8a4.4 4.4 0 0 1 8.5 1.9c0 3.9-3 7.7-8.5 11.1z"/><path d="M12 8V2.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>Lipa</div>
    <button class="nl" data-view="learn"></button>
    <button class="nl" data-view="review"></button>
    <button class="nl" data-view="words"></button>
    <div class="small">
      <button data-act="theme">Switch light / dark</button>
      <button data-act="reset">Reset progress</button>
    </div>
  </nav>
  <main id="main"></main>
  <aside class="rail" id="rail"></aside>
</div>

<div class="lesson" id="lesson" role="dialog" aria-modal="true" aria-label="Lesson">
  <div class="ltop">
    <button class="x" data-act="close" aria-label="Close lesson"></button>
    <div class="bar"><i id="barfill"></i></div>
  </div>
  <div class="lbody"><div class="stage" id="stage"></div></div>
  <div class="lfoot" id="lfoot">
    <div class="fin"><div class="fb" id="fb"></div><button class="go" id="go">Check</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- COURSE CONTENT (edit here) ---------------- */
const LV={A1:[
{t:"Pozdravi", e:"Greetings",
 v:["zdravo|hello","živjo|hi","dober dan|good day","dobro jutro|good morning","dober večer|good evening","lahko noč|good night","nasvidenje|goodbye","adijo|bye","hvala|thank you","prosim|please","oprostite|excuse me","ja|yes","ne|no"],
 d:[["Ana","Dober dan!","Good day!"],["Marko","Dober dan! Kako ste?","Good day! How are you?"],["Ana","Dobro, hvala. In vi?","Fine, thanks. And you?"],["Marko","Tudi dobro, hvala.","Also fine, thanks."],["Ana","Nasvidenje!","Goodbye!"],["Marko","Nasvidenje, lep dan!","Goodbye, have a nice day!"]],
 g:{t:"Ti or vi?", h:`<p>Slovenian has two ways to say <i>you</i>.</p><table class="gt"><tr><td>ti</td><td><b>Kako si?</b></td><td>friends, family, children</td></tr><tr><td>vi</td><td><b>Kako ste?</b></td><td>strangers, older people, work</td></tr></table><p class="tip">Vi is also the plural: talking to a group of friends, you say <b>Kako ste?</b></p>`,
  q:[{k:"mc",p:"You meet your best friend. How do you ask how they are?",o:["Kako si?","Kako ste?","Kako sem?"]},{k:"mc",p:"You meet your new boss. How do you ask how they are?",o:["Kako ste?","Kako si?","Kako je?"]},{k:"gap",p:"Dobro, ___. In ti?",h:"Fine, thanks. And you?",o:["hvala","prosim","ne"]},{k:"type",p:"good night",a:["lahko noč"]}]}},

{t:"Kdo sem", e:"Introducing yourself",
 v:["jaz|I","ti|you (informal)","ime|name","Ime mi je ...|My name is ...","Kako ti je ime?|What's your name?","Veseli me.|Nice to meet you.","Od kod si?|Where are you from?","Sem iz Slovenije.|I'm from Slovenia.","Slovenec|Slovenian (man)","Slovenka|Slovenian (woman)","govorim|I speak","malo|a little"],
 d:[["Luka","Živjo! Jaz sem Luka. Kako ti je ime?","Hi! I'm Luka. What's your name?"],["Emma","Živjo, Luka! Ime mi je Emma.","Hi Luka! My name is Emma."],["Luka","Veseli me. Od kod si?","Nice to meet you. Where are you from?"],["Emma","Sem iz Anglije. Pa ti?","I'm from England. And you?"],["Luka","Jaz sem iz Ljubljane.","I'm from Ljubljana."],["Emma","Govorim malo slovensko.","I speak a little Slovenian."]],
 g:{t:"Biti: to be", h:`<table class="gt"><tr><td>jaz</td><td><b>sem</b></td><td>I am</td></tr><tr><td>ti</td><td><b>si</b></td><td>you are</td></tr><tr><td>on / ona</td><td><b>je</b></td><td>he / she is</td></tr><tr><td>mi</td><td><b>smo</b></td><td>we are</td></tr><tr><td>vi</td><td><b>ste</b></td><td>you are (plural, formal)</td></tr><tr><td>oni</td><td><b>so</b></td><td>they are</td></tr></table><p class="tip">Slovenian is famous for the <b>dual</b>, a special form for exactly two people: <b>midva sva</b> (we two are), <b>vidva sta</b> (you two are). You can often drop the pronoun: <b>Sem Luka.</b></p>`,
  q:[{k:"gap",p:"Ti ___ iz Slovenije?",h:"Are you from Slovenia?",o:["si","sem","smo"]},{k:"gap",p:"Mi ___ študenti.",h:"We are students.",o:["smo","ste","so"]},{k:"mc",p:"Which means \"we two are\"?",o:["midva sva","mi smo","vidva sta"]},{k:"type",p:"I am (verb only)",a:["sem","jaz sem"]}]}},

{t:"Številke", e:"Numbers",
 v:["nič|zero","ena|one","dva|two","tri|three","štiri|four","pet|five","šest|six","sedem|seven","osem|eight","devet|nine","deset|ten","dvajset|twenty","sto|one hundred"],
 d:[["Prodajalka","Dober dan! Izvolite.","Good day! What can I get you?"],["Kupec","Tri jabolka, prosim.","Three apples, please."],["Prodajalka","Še kaj?","Anything else?"],["Kupec","Ne, hvala. Koliko stane?","No, thanks. How much is it?"],["Prodajalka","Dva evra.","Two euros."],["Kupec","Izvolite. Hvala!","Here you are. Thanks!"]],
 g:{t:"Counting past ten", h:`<p>For 11 to 19, add <b>-najst</b>:</p><table class="gt"><tr><td>11</td><td><b>enajst</b></td></tr><tr><td>12</td><td><b>dvanajst</b></td></tr><tr><td>15</td><td><b>petnajst</b></td></tr><tr><td>30</td><td><b>trideset</b></td></tr></table><p class="tip">Like in German, the ones come first: 21 is <b>enaindvajset</b>, literally one-and-twenty.</p>`,
  q:[{k:"mc",p:"12",o:["dvanajst","dvajset","dva"]},{k:"mc",p:"25",o:["petindvajset","dvajsetpet","petnajst"]},{k:"mc",p:"What number is enaindvajset?",o:["21","12","11"]},{k:"type",p:"15",a:["petnajst"]}]}},

{t:"Družina", e:"Family",
 v:["družina|family","mama|mum","oče|father","brat|brother","sestra|sister","sin|son","hči|daughter","babica|grandmother","dedek|grandfather","mož|husband","žena|wife","otrok|child","imam|I have"],
 d:[["Nina","Ali imaš brata ali sestro?","Do you have a brother or a sister?"],["Jan","Imam eno sestro. Ime ji je Maja.","I have one sister. Her name is Maja."],["Nina","Koliko je stara?","How old is she?"],["Jan","Stara je deset let.","She's ten years old."],["Nina","Jaz imam dva brata.","I have two brothers."],["Jan","Super!","Great!"]],
 g:{t:"Moj, moja, moje", h:`<p><i>My</i> changes with the gender of the noun.</p><table class="gt"><tr><td>masculine</td><td><b>moj</b> brat</td></tr><tr><td>feminine</td><td><b>moja</b> sestra</td></tr><tr><td>neuter</td><td><b>moje</b> ime</td></tr></table><p class="tip">Quick rule: most feminine nouns end in <b>-a</b>, neuter nouns in <b>-o</b> or <b>-e</b>, and masculine nouns in a consonant.</p>`,
  q:[{k:"gap",p:"___ mama",h:"my mum",o:["moja","moj","moje"]},{k:"gap",p:"___ oče",h:"my father",o:["moj","moja","moje"]},{k:"gap",p:"___ ime",h:"my name",o:["moje","moj","moja"]},{k:"mc",p:"Which noun is feminine?",o:["sestra","brat","otrok"]}]}},

{t:"Hrana in pijača", e:"Food and drink",
 v:["kruh|bread","voda|water","kava|coffee","čaj|tea","mleko|milk","jabolko|apple","sir|cheese","meso|meat","juha|soup","pivo|beer","vino|wine","zajtrk|breakfast","kosilo|lunch","večerja|dinner"],
 d:[["Mama","Kaj boš za zajtrk?","What will you have for breakfast?"],["Tim","Kruh in sir, prosim.","Bread and cheese, please."],["Mama","Kavo ali čaj?","Coffee or tea?"],["Tim","Čaj z mlekom.","Tea with milk."],["Mama","Imaš rad jabolka?","Do you like apples?"],["Tim","Ja, zelo rad!","Yes, a lot!"]],
 g:{t:"Rad imam: I like", h:`<p>To say you like something, use <b>rad imam</b>. The word <i>rad</i> changes with who is speaking.</p><table class="gt"><tr><td>a man says</td><td><b>Rad imam</b> kavo.</td></tr><tr><td>a woman says</td><td><b>Rada imam</b> kavo.</td></tr></table><p class="tip">Notice <b>kava</b> becomes <b>kavo</b> after <i>imam</i>. You'll learn why in the café chapter.</p>`,
  q:[{k:"gap",p:"(woman) ___ imam čaj.",h:"I like tea.",o:["Rada","Rad","Radi"]},{k:"gap",p:"(man) Rad ___ pivo.",h:"I like beer.",o:["imam","sem","je"]},{k:"mc",p:"What is \"večerja\"?",o:["dinner","breakfast","lunch"]},{k:"type",p:"bread",a:["kruh"]}]}},

{t:"V kavarni", e:"At the café",
 v:["kavarna|café","natakar|waiter","Rad bi ...|I would like ... (man)","Rada bi ...|I would like ... (woman)","kozarec|glass","račun|bill","Koliko stane?|How much is it?","izvolite|here you are","Na zdravje!|Cheers!","torta|cake","sladkor|sugar","brez|without"],
 d:[["Natakar","Dober dan. Kaj boste?","Good day. What will you have?"],["Petra","Rada bi eno kavo z mlekom.","I'd like a coffee with milk."],["Natakar","Še kaj?","Anything else?"],["Petra","Ja, en kos torte, prosim.","Yes, a piece of cake, please."],["Petra","Račun, prosim.","The bill, please."],["Natakar","Pet evrov. Hvala lepa.","Five euros. Thank you very much."]],
 g:{t:"Ordering: kava becomes kavo", h:`<p>When you order or want something, feminine nouns change <b>-a</b> to <b>-o</b>.</p><table class="gt"><tr><td>kava</td><td>Rad bi <b>eno kavo</b>.</td></tr><tr><td>voda</td><td>Rada bi <b>vodo</b>.</td></tr><tr><td>torta</td><td>Rad bi <b>torto</b>.</td></tr></table><p class="tip">Most masculine things stay the same: <b>en čaj</b>, <b>en sok</b>.</p>`,
  q:[{k:"gap",p:"Rad bi eno ___.",h:"I'd like a coffee.",o:["kavo","kava","kave"]},{k:"gap",p:"Rada bi ___, prosim.",h:"I'd like water, please.",o:["vodo","voda","vodi"]},{k:"gap",p:"En ___, prosim.",h:"A tea, please.",o:["čaj","čaja","čajo"]},{k:"type",p:"The bill, please.",a:["račun, prosim","račun prosim"]}]}},

{t:"Barve in oblačila", e:"Colours and clothes",
 v:["rdeč|red","moder|blue","zelen|green","rumen|yellow","črn|black","bel|white","majica|T-shirt","hlače|trousers","krilo|skirt","obleka|dress","čevlji|shoes","jakna|jacket","plašč|coat"],
 d:[["Prodajalec","Vam lahko pomagam?","Can I help you?"],["Sara","Iščem modro jakno.","I'm looking for a blue jacket."],["Prodajalec","Tukaj je modra jakna.","Here's a blue jacket."],["Sara","Imate tudi črno?","Do you have a black one too?"],["Prodajalec","Ja, izvolite.","Yes, here you are."],["Sara","Lepa je. Vzamem jo.","It's nice. I'll take it."]],
 g:{t:"Colours match the noun", h:`<p>Adjectives take the same gender as the noun.</p><table class="gt"><tr><td>masculine</td><td><b>rdeč</b> plašč</td></tr><tr><td>feminine</td><td><b>rdeča</b> majica</td></tr><tr><td>neuter</td><td><b>rdeče</b> krilo</td></tr></table><p class="tip">Some adjectives lose an <b>e</b>: moder becomes <b>modra</b> and <b>modro</b>.</p>`,
  q:[{k:"gap",p:"___ majica",h:"a red T-shirt",o:["rdeča","rdeč","rdeče"]},{k:"gap",p:"zeleno ___",h:"a green skirt",o:["krilo","jakna","plašč"]},{k:"gap",p:"črn ___",h:"a black coat",o:["plašč","obleka","krilo"]},{k:"mc",p:"a blue dress",o:["modra obleka","moder obleka","modro obleka"]}]}},

{t:"Dnevi in čas", e:"Days and time",
 v:["ponedeljek|Monday","torek|Tuesday","sreda|Wednesday","četrtek|Thursday","petek|Friday","sobota|Saturday","nedelja|Sunday","danes|today","jutri|tomorrow","včeraj|yesterday","teden|week","ura|hour, o'clock","Koliko je ura?|What time is it?"],
 d:[["Eva","Koliko je ura?","What time is it?"],["Maks","Ura je tri.","It's three o'clock."],["Eva","Kateri dan je danes?","What day is it today?"],["Maks","Danes je petek.","Today is Friday."],["Eva","Super! Jutri je sobota.","Great! Tomorrow is Saturday."],["Maks","Greva v soboto v kino?","Shall we go to the cinema on Saturday?"]],
 g:{t:"On Monday: v ponedeljek", h:`<p>For <i>on</i> a day, use <b>v</b>. Days ending in <b>-a</b> change to <b>-o</b>.</p><table class="gt"><tr><td>ponedeljek</td><td><b>v ponedeljek</b></td></tr><tr><td>sreda</td><td><b>v sredo</b></td></tr><tr><td>sobota</td><td><b>v soboto</b></td></tr><tr><td>nedelja</td><td><b>v nedeljo</b></td></tr></table>`,
  q:[{k:"gap",p:"v ___",h:"on Wednesday",o:["sredo","sreda","sredi"]},{k:"gap",p:"v ___",h:"on Sunday",o:["nedeljo","nedelja","nedelje"]},{k:"mc",p:"on Monday",o:["v ponedeljek","v ponedeljko","na ponedeljek"]},{k:"type",p:"tomorrow",a:["jutri"]}]}},

{t:"V mestu", e:"In the city",
 v:["mesto|city","ulica|street","trgovina|shop","banka|bank","pošta|post office","lekarna|pharmacy","postaja|station","avtobus|bus","levo|left","desno|right","naravnost|straight on","blizu|near","daleč|far","Kje je ...?|Where is ...?"],
 d:[["Turist","Oprostite, kje je pošta?","Excuse me, where is the post office?"],["Gospa","Pojdite naravnost, potem levo.","Go straight on, then left."],["Turist","Je daleč?","Is it far?"],["Gospa","Ne, zelo blizu je.","No, it's very close."],["Turist","Najlepša hvala!","Thank you very much!"],["Gospa","Ni za kaj.","You're welcome."]],
 g:{t:"Where you are: v banki, na pošti", h:`<p>To say <i>at</i> or <i>in</i> a place, use <b>v</b> or <b>na</b>, and the ending becomes <b>-i</b>.</p><table class="gt"><tr><td>banka</td><td><b>v banki</b></td></tr><tr><td>trgovina</td><td><b>v trgovini</b></td></tr><tr><td>pošta</td><td><b>na pošti</b></td></tr><tr><td>postaja</td><td><b>na postaji</b></td></tr></table><p class="tip">Which places take <b>na</b> is a habit to learn word by word. Pošta and postaja always go with na.</p>`,
  q:[{k:"gap",p:"Sem v ___.",h:"I'm at the bank.",o:["banki","banka","banko"]},{k:"gap",p:"Čakam na ___.",h:"I'm waiting at the station.",o:["postaji","postaja","postajo"]},{k:"mc",p:"at the post office",o:["na pošti","v pošti","na pošta"]},{k:"type",p:"left",a:["levo"]}]}},

{t:"Doma", e:"At home",
 v:["hiša|house","stanovanje|flat","soba|room","kuhinja|kitchen","kopalnica|bathroom","spalnica|bedroom","miza|table","stol|chair","postelja|bed","okno|window","vrata|door","balkon|balcony"],
 d:[["Klara","To je moje stanovanje.","This is my flat."],["Rok","Lepo je! Koliko sob imaš?","It's nice! How many rooms do you have?"],["Klara","Imam dve sobi, kuhinjo in kopalnico.","I have two rooms, a kitchen and a bathroom."],["Rok","Imaš tudi balkon?","Do you have a balcony too?"],["Klara","Ja, majhen balkon z rožami.","Yes, a small balcony with flowers."]],
 g:{t:"Imeti: to have", h:`<table class="gt"><tr><td>jaz</td><td><b>imam</b></td></tr><tr><td>ti</td><td><b>imaš</b></td></tr><tr><td>on / ona</td><td><b>ima</b></td></tr><tr><td>mi</td><td><b>imamo</b></td></tr><tr><td>vi</td><td><b>imate</b></td></tr><tr><td>oni</td><td><b>imajo</b></td></tr></table><p class="tip">For <i>don't have</i>, swap the start: <b>nimam, nimaš, nima</b>.</p>`,
  q:[{k:"gap",p:"Ona ___ veliko hišo.",h:"She has a big house.",o:["ima","imam","imajo"]},{k:"gap",p:"Mi ___ balkon.",h:"We have a balcony.",o:["imamo","imate","imajo"]},{k:"gap",p:"Jaz ___ avta.",h:"I don't have a car.",o:["nimam","imam","nima"]},{k:"type",p:"kitchen",a:["kuhinja"]}]}},

{t:"Moj dan", e:"My day",
 v:["delati|to work","spati|to sleep","jesti|to eat","piti|to drink","brati|to read","govoriti|to speak","iti|to go","vstati|to get up","zjutraj|in the morning","popoldne|in the afternoon","zvečer|in the evening","vedno|always","včasih|sometimes"],
 d:[["Tina","Kdaj vstaneš?","When do you get up?"],["Bor","Vstanem ob sedmih.","I get up at seven."],["Tina","Kaj delaš popoldne?","What do you do in the afternoon?"],["Bor","Popoldne delam, zvečer berem.","In the afternoon I work, in the evening I read."],["Tina","Jaz zvečer vedno gledam filme.","I always watch films in the evening."]],
 g:{t:"I do, you do", h:`<p>In the present tense, the <i>I</i> form ends in <b>-m</b> and the <i>you</i> form in <b>-š</b>.</p><table class="gt"><tr><td>delati</td><td><b>delam</b></td><td><b>delaš</b></td></tr><tr><td>govoriti</td><td><b>govorim</b></td><td><b>govoriš</b></td></tr><tr><td>brati</td><td><b>berem</b></td><td><b>bereš</b></td></tr><tr><td>piti</td><td><b>pijem</b></td><td><b>piješ</b></td></tr></table>`,
  q:[{k:"gap",p:"Jaz ___ slovensko.",h:"I speak Slovenian.",o:["govorim","govoriš","govori"]},{k:"gap",p:"Ti ___ knjigo?",h:"Are you reading a book?",o:["bereš","berem","bere"]},{k:"mc",p:"I drink",o:["pijem","pije","piti"]},{k:"type",p:"I work",a:["delam","jaz delam"]}]}},

{t:"Vreme", e:"Weather and seasons",
 v:["vreme|weather","sonce|sun","dež|rain","sneg|snow","veter|wind","toplo|warm","mrzlo|cold","Dežuje.|It's raining.","Sneži.|It's snowing.","pomlad|spring","poletje|summer","jesen|autumn","zima|winter"],
 d:[["Lara","Kakšno je vreme danes?","What's the weather like today?"],["Žan","Mrzlo je in sneži.","It's cold and snowing."],["Lara","Imaš rad zimo?","Do you like winter?"],["Žan","Ne, raje imam poletje.","No, I prefer summer."],["Lara","Jaz tudi. Poleti greva na morje!","Me too. In summer we're going to the seaside!"]],
 g:{t:"No \"it\" needed", h:`<p>Weather sentences don't need a word for <i>it</i>:</p><table class="gt"><tr><td>It's raining.</td><td><b>Dežuje.</b></td></tr><tr><td>It's snowing.</td><td><b>Sneži.</b></td></tr><tr><td>It's warm.</td><td><b>Toplo je.</b></td></tr></table><p class="tip">Seasons have their own <i>in</i> forms: <b>spomladi, poleti, jeseni, pozimi</b>.</p>`,
  q:[{k:"mc",p:"in winter",o:["pozimi","v zima","zimi"]},{k:"mc",p:"It's raining.",o:["Dežuje.","Je dež.","Dež je dežuje."]},{k:"gap",p:"Poleti je ___.",h:"In summer it's warm.",o:["toplo","mrzlo","sneži"]},{k:"type",p:"snow",a:["sneg"]}]}}
],

{t:"Včeraj", e:"Talking about the past",
 v:["prejšnji teden|last week","lani|last year","pred dvema dnevoma|two days ago","bil sem|I was (man)","bila sem|I was (woman)","delal sem|I worked (man)","šla sem|I went (woman)","videl sem|I saw (man)","kupila sem|I bought (woman)","srečati|to meet","zgodaj|early","pozno|late"],
 d:[["Ana","Kaj si delal včeraj?","What did you do yesterday?"],["Miha","Bil sem v Ljubljani.","I was in Ljubljana."],["Ana","Kaj si videl?","What did you see?"],["Miha","Videl sem grad in Tromostovje.","I saw the castle and the Triple Bridge."],["Ana","Jaz sem bila doma in brala knjigo.","I was at home reading a book."],["Miha","Tudi lepo!","That's nice too!"]],
 g:{t:"Past tense: sem delal", h:`<p>The past tense is <b>biti</b> plus a form ending in <b>-l</b>. That ending shows who did it.</p><table class="gt"><tr><td>jaz</td><td><b>sem delal / delala</b></td></tr><tr><td>ti</td><td><b>si delal / delala</b></td></tr><tr><td>on / ona</td><td><b>je delal / delala</b></td></tr><tr><td>mi</td><td><b>smo delali</b></td></tr><tr><td>vi</td><td><b>ste delali</b></td></tr><tr><td>oni</td><td><b>so delali</b></td></tr></table><p class="tip">Men use <b>-l</b>, women <b>-la</b>, groups <b>-li</b>. The little word sem likes second place: <b>Včeraj sem delal.</b></p>`,
  q:[{k:"gap",p:"(woman) Včeraj sem ___ doma.",h:"Yesterday I was at home.",o:["bila","bil","bili"]},{k:"gap",p:"Mi ___ bili v kinu.",h:"We were at the cinema.",o:["smo","sem","so"]},{k:"mc",p:"He worked.",o:["On je delal.","On je delala.","On sem delal."]},{k:"type",p:"(man) I was",a:["bil sem","sem bil","jaz sem bil"]}]}},

{t:"Načrti", e:"Plans and the future",
 v:["naslednji teden|next week","načrt|plan","počitnice|holidays","vikend|weekend","bom|I will","boš|you will","bo|he / she will","obiskati|to visit","potovati|to travel","ostati|to stay","mogoče|maybe","zagotovo|definitely"],
 d:[["Jure","Kaj boš delala ta vikend?","What will you do this weekend?"],["Maja","V soboto bom obiskala babico.","On Saturday I'll visit my grandma."],["Jure","In v nedeljo?","And on Sunday?"],["Maja","Mogoče bom šla v hribe. Greš zraven?","Maybe I'll go to the mountains. Are you coming?"],["Jure","Zagotovo!","Definitely!"]],
 g:{t:"Future: bom delal", h:`<p>The future is <b>bom</b> plus the same <b>-l</b> form you know from the past.</p><table class="gt"><tr><td>jaz</td><td><b>bom</b></td></tr><tr><td>ti</td><td><b>boš</b></td></tr><tr><td>on / ona</td><td><b>bo</b></td></tr><tr><td>mi</td><td><b>bomo</b></td></tr><tr><td>vi</td><td><b>boste</b></td></tr><tr><td>oni</td><td><b>bodo</b></td></tr></table><p class="tip">On its own, bom means <i>I will be</i>: <b>Jutri bom doma.</b></p>`,
  q:[{k:"gap",p:"Jutri ___ doma.",h:"Tomorrow I'll be at home.",o:["bom","boš","bodo"]},{k:"gap",p:"Oni ___ potovali.",h:"They will travel.",o:["bodo","bomo","bo"]},{k:"mc",p:"We will visit.",o:["Obiskali bomo.","Obiskali smo.","Obiskal bom."]},{k:"type",p:"to travel",a:["potovati"]}]}},

{t:"Na potovanju", e:"Travelling",
 v:["vlak|train","letališče|airport","letalo|plane","karta|ticket","povratna karta|return ticket","peron|platform","zamuda|delay","odhod|departure","prihod|arrival","kovček|suitcase","potni list|passport","prenočišče|accommodation"],
 d:[["Potnik","Dober dan, eno povratno karto za Maribor, prosim.","Hello, a return ticket to Maribor, please."],["Blagajničarka","Izvolite. Petnajst evrov.","Here you are. Fifteen euros."],["Potnik","S katerega perona odpelje vlak?","Which platform does the train leave from?"],["Blagajničarka","S tretjega perona, ob desetih.","From platform three, at ten."],["Potnik","Ima vlak zamudo?","Is the train delayed?"],["Blagajničarka","Ne, vozi točno.","No, it's on time."]],
 g:{t:"Kam? or Kje?", h:`<p>Going somewhere and being somewhere use different endings.</p><table class="gt"><tr><td>Kam? (where to)</td><td>Grem <b>v Ljubljano</b>.</td><td>Grem <b>na postajo</b>.</td></tr><tr><td>Kje? (where)</td><td>Sem <b>v Ljubljani</b>.</td><td>Sem <b>na postaji</b>.</td></tr></table><p class="tip">Movement takes <b>-o</b>, location takes <b>-i</b> (for words ending in -a).</p>`,
  q:[{k:"gap",p:"Jutri grem v ___.",h:"Tomorrow I'm going to Ljubljana.",o:["Ljubljano","Ljubljani","Ljubljana"]},{k:"gap",p:"Zdaj sem na ___.",h:"I'm at the station now.",o:["postaji","postajo","postaja"]},{k:"mc",p:"What does \"Kam greš?\" mean?",o:["Where are you going?","Where are you?","When are you going?"]},{k:"type",p:"train",a:["vlak"]}]}},

{t:"Pri zdravniku", e:"At the doctor's",

]};

const LVINFO={A1:{d:"Beginner course, level A1",top:"Šmarna gora, 669 m"},A2:{d:"Elementary course, level A2",top:"Triglav, 2864 m"}};
let lvl=(()=>{try{const l=localStorage.getItem("lipa-level");if(l&&LV[l])return l}catch(e){}return"A1"})();
let C=LV[lvl];
const K=(ci,li)=>(lvl==="A1"?"":lvl+":")+ci+"-"+li;
const LN=[{n:"New words",ic:"book"},{n:"More words",ic:"cards"},{n:"Conversation",ic:"chat"},{n:"Grammar",ic:"blocks"},{n:"Chapter review",ic:"flag"}];

/* ---------------- helpers ---------------- */
const IC={
 book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
 cards:'<rect x="3" y="7" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/>',
 chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
 blocks:'<rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><path d="M17 13v8M13 17h8"/>',
 flag:'<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>',
 sound:'<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>',
 mount:'<path d="m3 20 6.5-11 4 6 2.5-3.5L21 20z"/>',
 review:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
 close:'<path d="M6 6l12 12M18 6 6 18"/>',
 check:'<path d="m5 12 5 5 9-10"/>',
 chev:'<path d="m6 9 6 6 6-6"/>'
};
const icon=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const LEAF='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21C6.5 17.6 3.5 13.8 3.5 9.9A4.4 4.4 0 0 1 12 8a4.4 4.4 0 0 1 8.5 1.9c0 3.9-3 7.7-8.5 11.1z"/></svg>';
const $=s=>document.querySelector(s);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const norm=s=>s.toLowerCase().replace(/\.\.\./g," ").replace(/[.,!?…"„“”:;()]/g,"").replace(/\s+/g," ").trim();
const plain=s=>norm(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const W=ci=>C[ci].v.map(s=>{const[sl,en]=s.split("|");return{sl,en}});
const ALLW=()=>C.flatMap((c,i)=>W(i));
const half=ci=>Math.ceil(C[ci].v.length/2);
const toks=s=>s.split(" ");
const clean=t=>t.replace(/[.,!?…]/g,"");

/* ---------------- progress (saved in this browser) ---------------- */
const KEY="lipa-sl-a1";
const def=()=>({done:{},xp:0,streak:0,last:null,day:null,dayXp:0,goal:30});
let S=(()=>{try{const r=localStorage.getItem(KEY);if(r)return Object.assign(def(),JSON.parse(r))}catch(e){}return def()})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toLocaleDateString("sv");
const yday=()=>{const d=new Date();d.setDate(d.getDate()-1);return d.toLocaleDateString("sv")};
const chDone=ci=>LN.filter((_,li)=>S.done[K(ci,li)]).length;
const totalDone=()=>C.reduce((n,_,ci)=>n+chDone(ci),0);
const nextLesson=()=>{for(let ci=0;ci<C.length;ci++)for(let li=0;li<5;li++)if(!S.done[K(ci,li)])return[ci,li];return null};
const learned=()=>C.reduce((n,c,ci)=>n+(S.done[K(ci,0)]?half(ci):0)+(S.done[K(ci,1)]?c.v.length-half(ci):0),0);
const totalW=()=>C.reduce((n,c)=>n+c.v.length,0);
const NL=()=>C.length*5;
const dayXp=()=>S.day===today()?S.dayXp:0;
try{const th=localStorage.getItem("lipa-theme");if(th)document.documentElement.dataset.theme=th}catch(e){}

/* ---------------- audio ---------------- */
let voice=null,warned=false;
const hasTTS="speechSynthesis" in window;
function pickVoice(){const vs=speechSynthesis.getVoices();voice=vs.find(v=>/^sl/i.test(v.lang))||null}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function say(t,cb){
  if(!hasTTS){cb&&cb();return}
  if(!voice&&!warned){warned=true;toast("This device has no Slovenian voice installed, so audio may sound off.")}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t.replace(/\.\.\./g,""));
  u.lang="sl-SI";if(voice)u.voice=voice;u.rate=.88;
  u.onend=()=>cb&&cb();u.onerror=()=>cb&&cb();
  speechSynthesis.speak(u);
}
const sayBtn=t=>`<button class="say" data-say="${esc(t)}" aria-label="Listen">${icon("sound",18)}</button>`;
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3800)}

/* ---------------- views ---------------- */
let view="learn",openCh=new Set();
const NAV={learn:["Learn","mount"],review:["Review","review"],words:["Words","book"]};
function renderNav(){document.querySelectorAll(".nl").forEach(b=>{const[n,i]=NAV[b.dataset.view];b.innerHTML=icon(i,22)+`<span>${n}</span>`;b.toggleAttribute("aria-current",b.dataset.view===view);if(b.dataset.view===view)b.setAttribute("aria-current","page")})}
function stats(){
  const dx=dayXp(),pct=Math.min(100,Math.round(dx/S.goal*100)),done=totalDone();
  $("#rail").innerHTML=`
  <div class="panel streak"><div class="num">${S.streak}</div><div><h3>Day streak</h3><p>${S.streak?"Keep it going with a lesson today.":"Finish a lesson to start one."}</p></div></div>
  <div class="panel goal"><div class="ring" style="--p:${pct}"><span>${pct}%</span></div><div><h3>Daily goal</h3><p>${dx} of ${S.goal} XP today</p></div></div>
  <div class="panel"><h3>Slovenian ${lvl}</h3><div class="meter"><i style="width:${done/NL()*100}%"></i></div><p>${done} of ${NL()} lessons done</p><p>${learned()} of ${totalW()} words learned</p></div>
  <div class="panel"><h3>${S.xp} XP</h3><p>Total points earned</p></div>`;
  return `<div class="mstats"><span class="chip">Streak <b>${S.streak}</b></span><span class="chip">Today <b>${dx}/${S.goal}</b> XP</span><span class="chip">${lvl} <b>${done}</b>/${NL()} lessons</span></div>`;
}
function render(){
  renderNav();const ms=stats();const m=$("#main");
  if(view==="learn")m.innerHTML=ms+learnHTML();
  if(view==="words")m.innerHTML=ms+wordsHTML();
  if(view==="review")m.innerHTML=ms+reviewHTML();
}
function learnHTML(){
  const nx=nextLesson();
  if(nx&&!openCh.size)openCh.add(nx[0]);
  const hero=nx?`<section class="hero"><div class="leaf">${LEAF}</div>
    <p class="meta">Chapter ${nx[0]+1}, ${LN[nx[1]].n.toLowerCase()}</p>
    <h2 class="sl">${C[nx[0]].t}</h2><p class="en">${C[nx[0]].e}</p>
    <button class="btn" data-start="${nx[0]}-${nx[1]}">${totalDone()?"Continue lesson":"Start your first lesson"}</button></section>`
   :`<section class="hero"><div class="leaf">${LEAF}</div><p class="meta">Course complete</p><h2 class="sl">Čestitke!</h2><p class="en">Congratulations, you've finished Slovenian ${lvl}. Keep your words fresh in Review.</p><button class="btn" data-view="review">Go to review</button></section>`;
  const tabs=["A1","A2","B1","B2"].map((l,i)=>`<button class="tab" role="tab" aria-selected="${l===lvl}" ${LV[l]?`data-lvl="${l}"`:'disabled title="Coming soon"'}>${l}</button>`).join("");
  const chs=C.map((c,ci)=>{
    const d=chDone(ci),p=d/5*100,cls=d===5?"full":d?"part":"";
    const rows=LN.map((l,li)=>{const k=ci+"-"+li,ok=S.done[K(ci,li)];return`<li><button class="lrow ${ok?"done":""}" data-start="${k}"><span class="lic">${icon(ok?"check":l.ic)}</span><span class="nm">${l.n}</span><span class="st">${ok?"Done":"Start"}</span></button></li>`}).join("");
    return`<li class="ch ${openCh.has(ci)?"open":""}"><div class="node ${cls}" style="--p:${p}"><span>${d===5?icon("check",18):ci+1}</span></div>
      <button class="chhead" data-ch="${ci}" aria-expanded="${openCh.has(ci)}"><span><h3>${c.t}</h3><span class="en">${c.e}</span></span><span class="cnt">${d} of 5</span><span class="chev">${icon("chev")}</span></button>
      <ul class="lessons">${rows}</ul></li>`}).join("");
  return`<header class="lvl"><div><h1>Slovenian</h1><p>${LVINFO[lvl].d}</p></div><div class="tabs" role="tablist">${tabs}</div></header>${hero}
   <ol class="trail">${chs}<li class="summit"><div class="node"><span>${icon("mount",22)}</span></div><h3>${LVINFO[lvl].top}</h3><p>Finish all ${C.length} chapters to reach the ${lvl} summit.</p></li></ol>`;
}
function wordsHTML(){
  const sec=C.map((c,ci)=>{const h=half(ci);return`<section class="wsec" data-sec><h2>${c.t}<small>${c.e}</small></h2><div class="wlist">${W(ci).map((w,i)=>{const on=S.done[K(ci,i<h?0:1)];return`<div class="wrow" data-w="${esc((w.sl+" "+w.en).toLowerCase())}"><span class="dot ${on?"on":""}" title="${on?"Learned":"Not learned yet"}"></span><span class="s">${w.sl}</span><span class="e">${w.en}</span>${sayBtn(w.sl)}</div>`}).join("")}</div></section>`}).join("");
  const note=hasTTS&&!voice?`<p class="note">Your device has no Slovenian voice, so audio uses a fallback. On Windows you can add one under Settings, Time and language, Speech.</p>`:"";
  return`<header class="ph"><h1>Words</h1><p>All ${totalW()} words from the ${lvl} course. A green dot means you've learned it in a lesson.</p><input class="search" type="search" placeholder="Search in Slovenian or English" data-search aria-label="Search words">${note}</header>${sec}`;
}
function reviewHTML(){
  const started=C.map((_,i)=>i).filter(i=>chDone(i));
  return`<header class="ph"><h1>Review</h1><p>Short mixed practice with words from the chapters you've started, so they stick.</p></header>
  <div class="revcard"><h2>Quick review</h2><p>${started.length?`10 questions from ${started.length} chapter${started.length>1?"s":""}.`:"You haven't started a chapter yet, so this review uses ${C[0].t} (${C[0].e})."}</p><button class="btn" data-act="review">Start review</button></div>`;
}

/* ---------------- exercise builders ---------------- */
function pool(ci){const w=W(ci);return w.concat(W(ci>0?ci-1:ci+1))}
function mcStep(ci,w,dir){
  const toEn=dir==="sl",key=toEn?"en":"sl";
  const o=uniq([w[key],...sh(pool(ci).map(x=>x[key]).filter(x=>x!==w[key]))]).slice(0,4);
  return{k:"mc",q:toEn?"Choose the meaning":"Choose the Slovenian",big:toEn?w.sl:w.en,bigSay:toEn,o:sh(o),a:w[key],say:w.sl};
}
const typeStep=w=>({k:"type",big:w.en,a:[w.sl],say:w.sl});
const matchStep=ws=>({k:"match",ws});
function gapStep(line,all){
  const t=toks(line[1]);const idx=sh(t.map((_,i)=>i).filter(i=>clean(t[i]).length>=3));if(!idx.length)return null;
  const i=idx[0],ans=clean(t[i]),cap=ans[0]!==ans[0].toLowerCase();
  const fix=x=>cap?x[0].toUpperCase()+x.slice(1):x.toLowerCase();
  const ds=sh(uniq(all.map(clean).filter(x=>x.length>=3&&x.toLowerCase()!==ans.toLowerCase()).map(fix))).slice(0,2);
  return{k:"gap",p:t.map((x,j)=>j===i?x.replace(ans,"___"):x).join(" "),hint:line[2],o:sh([ans,...ds]),a:ans,say:line[1]};
}
function orderStep(line){let tiles=sh(toks(line[1]));if(tiles.join(" ")===line[1])tiles=sh(tiles);return{k:"order",hint:line[2],tiles,a:line[1],say:line[1]}}
function meaningStep(d,i){return{k:"mc",q:"What does this mean?",big:d[i][1],bigSay:true,o:sh(uniq([d[i][2],...sh(d.filter((_,j)=>j!==i).map(x=>x[2])).slice(0,2)])),a:d[i][2],say:d[i][1]}}
function drill(d){
  if(d.k==="type")return{k:"type",big:d.p,a:d.a,say:d.a[0]};
  if(d.k==="gap")return{k:"gap",p:d.p,hint:d.h,o:sh(d.o),a:d.o[0],say:d.p.replace("___",d.o[0]).replace(/^\(.*?\)\s*/,"")};
  return{k:"mc",q:d.p,big:"",o:sh(d.o),a:d.o[0],say:/[a-zčšž]/i.test(d.o[0])&&!/^\d+$/.test(d.o[0])&&!/^[a-z ]+$/i.test(d.o[0])?d.o[0]:null,plainQ:true};
}
function vocabSteps(ci,ws,withType){
  const st=[];
  for(let i=0;i<ws.length;i+=2){const ch=ws.slice(i,i+2);ch.forEach(w=>st.push({k:"card",w}));ch.forEach((w,j)=>st.push(mcStep(ci,w,(i+j)%2?"en":"sl")))}
  if(ws.length>=4)st.push(matchStep(sh(ws).slice(0,5)));
  if(withType)sh(ws).slice(0,3).forEach(w=>st.push(typeStep(w)));
  return st;
}
function buildLesson(ci,li){
  const c=C[ci],ws=W(ci),h=half(ci);
  if(li===0)return vocabSteps(ci,ws.slice(0,h),false);
  if(li===1)return vocabSteps(ci,ws.slice(h),true);
  if(li===2){
    const d=c.d,all=d.flatMap(x=>toks(x[1]));
    const idx=sh(d.map((_,i)=>i)),ord=idx.filter(i=>{const n=toks(d[i][1]).length;return n>=3&&n<=8});
    return[{k:"dialog",d},gapStep(d[idx[0]],all),ord[0]!=null?orderStep(d[ord[0]]):null,gapStep(d[idx[1]],all),ord[1]!=null?orderStep(d[ord[1]]):null,meaningStep(d,idx[2])].filter(Boolean);
  }
  if(li===3)return[{k:"gram",g:c.g},...c.g.q.map(drill)];
  const r=sh(ws);
  const st=[...r.slice(0,4).map((w,i)=>mcStep(ci,w,i%2?"en":"sl")),...r.slice(4,7).map(typeStep),...sh(c.g.q).slice(0,2).map(drill)];
  const ol=c.d.filter(x=>{const n=toks(x[1]).length;return n>=3&&n<=8});if(ol.length)st.push(orderStep(sh(ol)[0]));
  const out=sh(st);out.splice(4,0,matchStep(r.slice(7,12).length>=4?r.slice(7,12):r.slice(0,5)));return out;
}
function buildReview(){
  let chs=C.map((_,i)=>i).filter(i=>chDone(i));if(!chs.length)chs=[0];
  const items=sh(chs.flatMap(ci=>W(ci).map(w=>({ci,w}))));
  const st=[...items.slice(0,6).map((x,i)=>mcStep(x.ci,x.w,i%2?"en":"sl")),...items.slice(6,9).map(x=>typeStep(x.w))];
  const out=sh(st);out.splice(5,0,matchStep(items.slice(9,14).map(x=>x.w).length>=4?items.slice(9,14).map(x=>x.w):items.slice(0,5).map(x=>x.w)));return out;
}

/* ---------------- lesson player ---------------- */
let L=null;
const PRAISE=["Odlično!","Bravo!","Tako je!","Super!","Zelo dobro!"];
function startLesson(ci,li,steps){
  L={ci,li,steps:steps||buildLesson(ci,li),i:0,correct:0,wrong:0,finished:false};
  $("#lesson").classList.add("on");document.body.style.overflow="hidden";renderStep();
}
function closeLesson(){if(hasTTS)speechSynthesis.cancel();$("#lesson").classList.remove("on");document.body.style.overflow="";L=null;render()}
function foot(mode,msg){
  L.mode=mode;const f=$("#lfoot");f.className="lfoot"+(mode==="good"?" good":mode==="bad"?" bad":"");
  $("#fb").innerHTML=msg||"";const g=$("#go");g.textContent=mode==="check"?"Check":"Continue";
  g.disabled=mode==="check"||mode==="wait";
}
const enable=()=>{$("#go").disabled=false};
function renderStep(){
  const s=L.steps[L.i];L.sel=null;L.ord=[];L.m={l:null,ok:0,miss:0};
  $("#barfill").style.width=(L.i/L.steps.length*100)+"%";
  const st=$("#stage");st.className="stage";st.innerHTML=R[s.k](s);
  $(".lbody").scrollTop=0;
  if(s.k==="card"){foot("next");say(s.w.sl)}
  else if(s.k==="dialog"||s.k==="gram")foot("next");
  else if(s.k==="match")foot("wait");
  else foot("check");
  if(s.k==="type"){const inp=$("#ans");inp.focus();inp.addEventListener("input",()=>{$("#go").disabled=!inp.value.trim()})}
}
const R={
  card:s=>`<p class="q">New word</p><div class="big">${s.w.sl} ${sayBtn(s.w.sl)}</div><p class="trans">${s.w.en}</p>`,
  mc:s=>`<p class="q">${s.plainQ?"Choose the right answer":s.q}</p>${s.plainQ?`<div class="big ${s.q.length>22?"long":""}">${s.q}</div>`:`<div class="big ${s.big.length>20?"long":""}">${s.big} ${s.bigSay?sayBtn(s.big):""}</div>`}<div class="opts">${s.o.map((o,i)=>`<button class="opt" data-opt="${i}">${o}</button>`).join("")}</div>`,
  gap:s=>`<p class="q">Fill in the gap</p><p class="sent">${s.p.replace("___",'<span class="blank" id="blank">&nbsp;</span>')}</p><p class="hint">${s.hint||""}</p><div class="opts row">${s.o.map((o,i)=>`<button class="opt" data-opt="${i}">${o}</button>`).join("")}</div>`,
  type:s=>`<p class="q">Write this in Slovenian</p><div class="big ${s.big.length>20?"long":""}">${s.big}</div><input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" lang="sl" aria-label="Your answer"><div class="keys">${["č","š","ž"].map(k=>`<button data-key="${k}">${k}</button>`).join("")}</div>`,
  order:s=>`<p class="q">Put the words in order</p><p class="hint">${s.hint}</p><div class="ansline" id="al"></div><div class="bank">${s.tiles.map((t,i)=>`<button class="tile" data-tile="${i}">${t}</button>`).join("")}</div>`,
  match:s=>{const l=sh(s.ws.map((_,i)=>i)),r=sh(s.ws.map((_,i)=>i));return`<p class="q">Match the pairs</p><div class="match"><div class="col">${l.map(i=>`<button class="mt" data-ml="${i}">${s.ws[i].sl}</button>`).join("")}</div><div class="col">${r.map(i=>`<button class="mt" data-mr="${i}">${s.ws[i].en}</button>`).join("")}</div></div>`},
  dialog:s=>{const sp=uniq(s.d.map(x=>x[0]));return`<p class="q">Listen and read. Tap a line to see the translation.</p><button class="ghost" data-act="playall">${icon("sound",18)} Play conversation</button><div class="dl">${s.d.map(x=>`<div class="line ${sp.indexOf(x[0])%2?"r":""}"><button class="bub" data-bub><div class="who">${x[0]}</div><div class="s">${x[1]}</div><div class="e">${x[2]}</div></button>${sayBtn(x[1])}</div>`).join("")}</div>`},
  gram:s=>`<h2 class="gh">${s.g.t}</h2><div class="gbody">${s.g.h}</div>`
};
function answerText(s){if(s.k==="type")return s.a[0];return s.a}
function doCheck(){
  const s=L.steps[L.i];let ok=false,extra="";
  if(s.k==="mc"||s.k==="gap"){
    ok=s.o[L.sel]===s.a;
    document.querySelectorAll(".opt").forEach((b,i)=>{b.classList.remove("sel");if(s.o[i]===s.a)b.classList.add("right");else if(i===L.sel)b.classList.add("wrong")});
    if(s.k==="gap")$("#blank").textContent=s.a;
  }else if(s.k==="type"){
    const v=$("#ans").value;
    if(s.a.some(a=>norm(a)===norm(v)))ok=true;
    else if(s.a.some(a=>plain(a)===plain(v))){ok=true;extra=`Watch the letters č, š and ž: <b>${s.a[0]}</b>`}
  }else if(s.k==="order"){
    ok=norm(L.ord.map(i=>s.tiles[i]).join(" "))===norm(s.a);
  }
  $("#stage").classList.add("locked");
  if(ok){L.correct++;foot("good",`<strong>${PRAISE[Math.random()*PRAISE.length|0]}</strong>${extra}`)}
  else{L.wrong++;if(!s.re)L.steps.push(Object.assign({},s,{re:true,o:s.o?sh(s.o):undefined,tiles:s.tiles?sh(s.tiles):undefined}));foot("bad",`<strong>Not quite</strong>Correct answer: ${answerText(s)}`)}
  if(s.say)say(s.say);
}
function next(){
  if(L.finished){closeLesson();return}
  L.i++;if(L.i>=L.steps.length)finish();else renderStep();
}
function finish(){
  const isReview=L.ci==null,key=K(L.ci,L.li);
  if(!isReview)S.done[key]=true;
  const xp=L.correct+(isReview?3:5),t=today();
  if(S.day!==t){S.day=t;S.dayXp=0}
  S.dayXp+=xp;S.xp+=xp;
  if(S.last!==t){S.streak=S.last===yday()?S.streak+1:1;S.last=t}
  save();
  const acc=Math.round(L.correct/Math.max(1,L.correct+L.wrong)*100);
  $("#barfill").style.width="100%";L.finished=true;
  if(!isReview&&L.li===4)openCh.clear();
  $("#stage").innerHTML=`<div class="done">${LEAF}<h2>${isReview?"Review done":"Lesson complete"}</h2><p>${isReview?"Your words are fresher now.":C[L.ci].t+", "+LN[L.li].n.toLowerCase()}</p><div class="stats"><div><b>+${xp}</b><span>XP</span></div><div><b>${acc}%</b><span>accuracy</span></div><div><b>${S.streak}</b><span>day streak</span></div></div></div>`;
  foot("next");
}

/* ---------------- events ---------------- */
document.addEventListener("click",e=>{
  const t=e.target;
  const sb=t.closest("[data-say]");if(sb){say(sb.dataset.say);return}
  const lv=t.closest("[data-lvl]");if(lv){lvl=lv.dataset.lvl;C=LV[lvl];openCh.clear();try{localStorage.setItem("lipa-level",lvl)}catch(e){}render();return}
  const v=t.closest("[data-view]");if(v){view=v.dataset.view;render();window.scrollTo(0,0);return}
  const stt=t.closest("[data-start]");if(stt){const[ci,li]=stt.dataset.start.split("-").map(Number);startLesson(ci,li);return}
  const ch=t.closest("[data-ch]");if(ch){const ci=+ch.dataset.ch;openCh.has(ci)?openCh.delete(ci):openCh.add(ci);render();return}
  const a=t.closest("[data-act]");
  if(a){const act=a.dataset.act;
    if(act==="close")closeLesson();
    if(act==="review")startLesson(null,null,buildReview());
    if(act==="theme"){const cur=document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");const n=cur==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("lipa-theme",n)}catch(e){}}
    if(act==="reset"){if(a.dataset.arm){S=def();save();openCh.clear();a.textContent="Reset progress";delete a.dataset.arm;render()}else{a.dataset.arm=1;a.textContent="Tap again to reset";setTimeout(()=>{if(a.dataset.arm){delete a.dataset.arm;a.textContent="Reset progress"}},3000)}}
    if(act==="playall"&&L){const d=L.steps[L.i].d;let i=0;const bubs=document.querySelectorAll("[data-bub]");const go=()=>{if(!L||i>=d.length)return;bubs[i]&&bubs[i].classList.add("show");say(d[i][1],()=>{i++;setTimeout(go,350)})};go()}
    return}
  if(!L||L.mode==="good"||L.mode==="bad")return;
  const s=L.steps[L.i];
  const op=t.closest("[data-opt]");if(op){L.sel=+op.dataset.opt;document.querySelectorAll(".opt").forEach(b=>b.classList.toggle("sel",b===op));if(s.k==="gap")$("#blank").textContent=s.o[L.sel];enable();return}
  const ky=t.closest("[data-key]");if(ky){const inp=$("#ans"),p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+ky.dataset.key+inp.value.slice(inp.selectionEnd??p);inp.focus();inp.setSelectionRange(p+1,p+1);enable();return}
  const bb=t.closest("[data-bub]");if(bb){bb.classList.toggle("show");return}
  const tl=t.closest("[data-tile]");if(tl){L.ord.push(+tl.dataset.tile);tl.classList.add("used");drawOrder();return}
  const rm=t.closest("[data-rm]");if(rm){const pos=+rm.dataset.rm,idx=L.ord.splice(pos,1)[0];document.querySelector(`[data-tile="${idx}"]`).classList.remove("used");drawOrder();return}
  const ml=t.closest("[data-ml]"),mr=t.closest("[data-mr]");
  if(ml||mr){
    const side=ml?"l":"r",el=ml||mr,idx=+(ml?ml.dataset.ml:mr.dataset.mr);
    document.querySelectorAll(`[data-m${side}]`).forEach(b=>b.classList.remove("sel"));
    el.classList.add("sel");L.m[side]=idx;L.m[side+"el"]=el;
    if(side==="l")say(s.ws[idx].sl);
    if(L.m.l!=null&&L.m.r!=null){
      const le=L.m.lel,re=L.m.rel;
      if(L.m.l===L.m.r){le.classList.add("ok");re.classList.add("ok");L.m.ok++}
      else{L.m.miss++;[le,re].forEach(b=>{b.classList.add("no");setTimeout(()=>b.classList.remove("no","sel"),450)})}
      le.classList.remove("sel");re.classList.remove("sel");L.m.l=L.m.r=null;
      if(L.m.ok===s.ws.length){L.correct++;foot("good",`<strong>${PRAISE[Math.random()*PRAISE.length|0]}</strong>${L.m.miss?"All pairs matched.":"All pairs matched on the first try."}`)}
    }
  }
});
function drawOrder(){const s=L.steps[L.i];$("#al").innerHTML=L.ord.map((i,p)=>`<button class="tile" data-rm="${p}">${s.tiles[i]}</button>`).join("");$("#go").disabled=!L.ord.length}
$("#go").addEventListener("click",()=>{if(!L)return;if(L.mode==="check")doCheck();else next()});
document.addEventListener("keydown",e=>{
  if(!L)return;
  if(e.key==="Escape")closeLesson();
  if(e.key==="Enter"&&!$("#go").disabled){e.preventDefault();$("#go").click()}
});
document.addEventListener("input",e=>{
  if(e.target.matches("[data-search]")){const q=e.target.value.toLowerCase().trim();
    document.querySelectorAll("[data-sec]").forEach(sec=>{let any=false;sec.querySelectorAll("[data-w]").forEach(r=>{const m=!q||r.dataset.w.includes(q);r.style.display=m?"":"none";any=any||m});sec.style.display=any?"":"none"})}
});
$('[data-act="close"]').innerHTML=icon("close",22);
render();
</script>
